<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Engineering compass: a central engineering core orbited by six coloured principles — fundamentals over hype, build before claiming, understand the whole system, measure before optimising, document what matters, improve every iteration.">
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tw{animation:tw 4.3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.16}50%{opacity:.88}}
.cr{animation:sp 46s linear infinite;transform-origin:500px 250px;transform-box:view-box}
.cr2{animation:sp 70s linear infinite reverse;transform-origin:500px 250px;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.pn{animation:pn 5s ease-in-out infinite}
@keyframes pn{0%,100%{opacity:.82}50%{opacity:1}}
.dash{animation:dash 22s linear infinite}
@keyframes dash{to{stroke-dashoffset:-400}}
</style>
