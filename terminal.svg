<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Onboard terminal: whoami returns cs-student, software-developer, ai/ml-builder. Mission build UltraMatrix. Learning C++, DSA, machine learning and generative AI. Status online.">
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}

