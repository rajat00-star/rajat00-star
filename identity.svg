<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Holographic crew manifest console: Rajat Sanger, CS student and AI/ML builder. Current mission UltraMatrix. Active learning C++ and DSA, machine learning, generative AI. Status building. Open to internships and open-source collaboration.">
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tw{animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.9}}
.blip{animation:bl 2.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.scan{animation:sc 7s linear infinite}
@keyframes sc{0%{transform:translateY(0)}100%{transform:translateY(324px)}}
.sweep{animation:sw 6s linear infinite;transform-origin:862px 214px;transform-box:view-box}
@keyframes sw{to{transform:rotate(360deg)}}
</style>
