<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="UltraMatrix planned architecture as a holographic system map: a Python AI/ML layer in violet feeding a central UltraMatrix core, a React and Next.js frontend layer in blue, a Node.js and Express backend layer in green, and TypeScript as the shared language in amber.">
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tw{animation:tw 4.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.9}}
.ar{animation:sp 44s linear infinite;transform-origin:500px 268px;transform-box:view-box}
.ar2{animation:sp 66s linear infinite reverse;transform-origin:500px 268px;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.p{offset-rotate:0deg;animation:flow 4s linear infinite}
@keyframes flow{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.hz{animation:hz 3.8s ease-in-out infinite}
@keyframes hz{0%,100%{opacity:.6}50%{opacity:1}}
</style>
