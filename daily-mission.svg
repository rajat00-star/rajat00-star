<radialGradient id="dlb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FBBF24" stop-opacity="0.2"/><stop offset="60%" stop-color="#FBBF24" stop-opacity="0.044"/><stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
<filter id="dg" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
