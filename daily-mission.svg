<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Daily DSA mission HUD: four problems per day in C++, looping through pattern, complexity, implement, optimise.">
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tw{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.bl{animation:bl 2.2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.sw{animation:sw 5s linear infinite;transform-origin:842px 105px;transform-box:view-box}
@keyframes sw{to{transform:rotate(360deg)}}
</style>
<defs>
