name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=7dd3fc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-nebula.svg?palette=github-dark&color_snake=a78bfa&color_dots=#02030A,#24104F,#4C1D95,#7C3AED,#A78BFA
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=7dd3fc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
