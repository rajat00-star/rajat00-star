name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-nebula.svg?palette=github-dark&color_snake=7dd3fc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
